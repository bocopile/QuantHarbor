# Q13 synthetic-only. No host mounts, published ports, persistent volumes or restart.
services:
  app:
    build:
      context: ..
      dockerfile: containers/Dockerfile.synthetic
      network: none
    platform: linux/arm64
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    tmpfs:
      - /tmp:size=16777216,mode=1777
    restart: "no"
  db:
    image: postgres@sha256:a5377a521c0383c9862394c90bdbf7707800ac9a6e40d18318193badfac52ce0
    platform: linux/arm64
    user: "999:999"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    environment:
      POSTGRES_USER: qh_synthetic
      POSTGRES_DB: qh_synthetic
      POSTGRES_PASSWORD: synthetic-only-not-a-credential
      PGDATA: /var/lib/postgresql/18/docker
    command: [postgres, -c, "listen_addresses=", -c, "max_connections=10", -c, "shared_buffers=16MB"]
    tmpfs:
      - /var/lib/postgresql:size=134217728,uid=999,gid=999,mode=0700
      - /var/run/postgresql:size=1048576,uid=999,gid=999,mode=0700
      - /tmp:size=16777216,mode=1777
    restart: "no"
